services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
      - "YOUR_TAILSCALE_IP:81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

networks:
  proxy:
    external: true

volumes:
  npm_data:
  npm_letsencrypt:
